  <div id="app">
    <section id="screen-library" class="screen"></section>
    <section id="screen-building" class="screen" hidden></section>
    <section id="screen-briefing" class="screen" hidden></section>
    <section id="screen-board" class="screen" hidden>
      <header class="topbar">
        <button id="btn-lib" class="tb">‹ Library</button>
        <button id="btn-brief" class="tb">Briefing</button>
        <div id="board-title" class="tb-title"></div>
        <span id="status" class="status" data-state="saved"><i></i><b>Saved</b></span>
        <button id="btn-bg" class="tb">Background</button>
        <button id="btn-360" class="tb" hidden>360°</button>
        <button id="btn-undo" class="tb" disabled>Undo</button>
        <button id="btn-redo" class="tb" disabled>Redo</button>
        <button id="btn-fit" class="tb">Fit</button>
        <button id="btn-save" class="tb strong">Save</button>
      </header>
      <div class="stage">
        <aside id="palette" class="palette"></aside>
        <main class="boardwrap">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
          <button id="pal-toggle" class="pal-toggle">◂ Palette</button>
          <div id="tool-banner" class="tool-banner" hidden></div>
        </main>
        <aside id="inspector" class="inspector" hidden></aside>
      </div>
    </section>
  </div>
  <div id="modal-root"></div>
  <input type="file" id="file-photo" accept="image/*" hidden>
  <input type="file" id="file-import" accept=".fireground,.json,application/json" hidden>
